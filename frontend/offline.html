<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FF7C00">
  <title>CampusGo - Offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #F8FAFC; color: #111827; font-family: system-ui, -apple-system, sans-serif; text-align: center; }
    main { max-width: 320px; padding: 24px; }
    h1 { font-size: 1.3rem; margin: 0 0 8px; }
    p { color: #4B5563; font-size: 0.95rem; line-height: 1.5; margin: 0 0 20px; }
    a { display: inline-block; background: #FF7C00; color: #fff; font-weight: 700; text-decoration: none;
        padding: 12px 28px; border-radius: 12px; }
    .sos { margin-top: 24px; font-size: 0.85rem; }
    .sos a { background: none; color: #B91C1C; padding: 0; }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>CampusGo needs an internet connection to find rides and show your trip. Check your mobile data or Wi-Fi.</p>
    <a href="/">Try again</a>
    <p class="sos">In an emergency call <a href="tel:112">112</a>.</p>
  </main>
</body>
</html>
