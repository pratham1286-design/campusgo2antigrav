services:
  campusgo-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campusgo-lpu-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # Required. Generate with: python -c "import secrets; print(secrets.token_hex(32))"
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY to a random 64-character value}
      - DATABASE_PATH=/app/data/campusgo.db
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS:-0}
      # Demo data and simulated payments are opt-in.
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-0}
      - DEMO_PASSWORD=${DEMO_PASSWORD:-}
      - PAYMENTS_DEMO_MODE=${PAYMENTS_DEMO_MODE:-0}
      - CAMPUSGO_UPI_VPA=${CAMPUSGO_UPI_VPA:-campusgo.lpu@okhdfcbank}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - FAST2SMS_API_KEY=${FAST2SMS_API_KEY:-}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
      - CAMPUS_SECURITY_PHONE=${CAMPUS_SECURITY_PHONE:-+91 1824 517000}
    volumes:
      # Only the database directory is persisted, so rebuilt images ship new code.
      - campusgo-db-data:/app/data

volumes:
  campusgo-db-data:
    driver: local
