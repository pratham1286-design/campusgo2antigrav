services:
  - type: web
    name: campusgo-lpu
    runtime: python
    region: singapore
    plan: free
    # NOTE: Render's free plan has no persistent disk, so the SQLite file is
    # lost on every deploy/restart. For real persistence use a paid plan, add:
    #   disk:
    #     name: campusgo-data
    #     mountPath: /var/data
    #     sizeGB: 1
    # and set DATABASE_PATH=/var/data/campusgo.db below.
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      if [ "$SEED_DEMO_DATA" = "1" ]; then python backend/seed_data.py --if-empty; fi &&
      gunicorn --chdir backend --workers 1 --threads 4 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/config
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      # Render sits behind one proxy; this makes rate limits use the real client IP.
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: PUBLIC_BASE_URL
        sync: false
      # Portfolio demo: creates the demo personas on an empty database.
      # Demo personas sign in by SMS code like everyone else.
      - key: SEED_DEMO_DATA
        value: "1"
      # "1" shows a fake moving vehicle driven from the UI. Leave "0": real trips use the driver's phone GPS.
      - key: DEMO_SIMULATE_MOVEMENT
        value: "0"
      # "1" lets reviewers top up with fake money. Leave "0" for anything real.
      - key: PAYMENTS_DEMO_MODE
        value: "0"
      - key: CAMPUSGO_UPI_VPA
        value: campusgo.lpu@okhdfcbank
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Logging in needs real SMS: set FAST2SMS_API_KEY (or the Twilio keys) below, otherwise
      # sign-in answers 503. "1" shows the code on screen instead; only for a throwaway demo,
      # because anyone who knows a demo ID + number could then log in as that person.
      - key: OTP_DEMO_MODE
        value: "0"
      # Place search and road routes use the free public OpenStreetMap servers by default; set
      # these for real traffic (see .env.example).
      - key: GEOCODER_CONTACT
        sync: false
      - key: NOMINATIM_URL
        sync: false
      - key: OSRM_URL
        sync: false
      - key: FAST2SMS_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
