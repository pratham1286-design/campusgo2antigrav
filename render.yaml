# Render blueprint sized for real traffic: several app instances sharing a managed PostgreSQL
# database and a Redis-compatible Key Value store. These are PAID plans (check Render's pricing
# page before deploying). For a single small instance instead, set the web plan to "starter",
# delete the `scaling` block, the Key Value service and the database, and remove DATABASE_URL /
# REDIS_URL: the app then uses SQLite and one worker. Add a persistent disk and point
# DATABASE_PATH at a file on it, or every deploy starts with an empty database.
databases:
  - name: campusgo-db
    plan: basic-1gb
    databaseName: campusgo
    user: campusgo
    ipAllowList: []          # reachable only from your Render services

services:
  - type: keyvalue
    name: campusgo-cache
    plan: starter
    ipAllowList: []          # reachable only from your Render services
    maxmemoryPolicy: volatile-ttl   # every key the app writes expires on its own

  - type: web
    name: campusgo-lpu
    runtime: python
    region: singapore
    plan: standard
    # More instances at peak hours, fewer when quiet. They share the database and Redis.
    scaling:
      minInstances: 1
      maxInstances: 4
      targetCPUPercent: 60
    buildCommand: pip install -r requirements.txt
    # The schema is created when the app starts (safe with many workers at once).
    startCommand: gunicorn --config backend/gunicorn.conf.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: DATABASE_URL
        fromDatabase:
          name: campusgo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: campusgo-cache
          property: connectionString
      # Workers per instance x DB_POOL_SIZE x instances must stay under the database's
      # connection limit (about 100 on basic plans): 3 x 8 x 4 = 96.
      - key: WEB_CONCURRENCY
        value: "3"
      - key: GUNICORN_THREADS
        value: "8"
      - key: DB_POOL_SIZE
        value: "8"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      # Render sits behind one proxy; this makes rate limits use the real client IP.
      - key: TRUST_PROXY_HOPS
        value: "1"
      # Your public address, e.g. https://campusgo.example.com (used in SOS trip links).
      - key: PUBLIC_BASE_URL
        sync: false
      # Signing in needs real SMS: set FAST2SMS_API_KEY (or the three Twilio keys).
      - key: FAST2SMS_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      # App Store / Play reviewers sign in with this number and fixed 6-digit code (see README).
      - key: REVIEW_LOGIN_PHONE
        sync: false
      - key: REVIEW_LOGIN_CODE
        sync: false
      # Payments: Razorpay keys (live keys for real money) and the webhook secret.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Optional: your UPI ID for direct UPI QR top-ups (approved by hand; leave empty to turn off).
      - key: CAMPUSGO_UPI_VPA
        sync: false
      # Play Store app (Trusted Web Activity): package name and signing-key SHA-256 from the Play Console.
      - key: ANDROID_PACKAGE_NAME
        sync: false
      - key: ANDROID_CERT_SHA256
        sync: false
      # Maps need no settings: map, place search and routes run inside the app. Optional:
      # OSRM_URL for a self-hosted road router (see .env.example).
      - key: OSRM_URL
        sync: false
