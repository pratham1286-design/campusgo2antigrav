services:
  - type: web
    name: campusgo-lpu
    env: python
    region: singapore
    plan: free
    # NOTE: Render's free plan does not support persistent disks, so the
    # SQLite file lives in the ephemeral container filesystem and resets to
    # seed data on every deploy/restart. Fine for a demo. For real
    # persistence, upgrade this service to a paid plan (Starter+), add:
    #   disk:
    #     name: campusgo-data
    #     mountPath: /var/data
    #     sizeGB: 1
    # and set DATABASE_PATH=/var/data/campusgo.db as an env var below.
    buildCommand: pip install -r requirements.txt && python backend/seed_data.py
    startCommand: gunicorn --chdir backend --workers 1 --threads 4 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PORT
        value: 5000
      - key: SECRET_KEY
        generateValue: true
      - key: CAMPUSGO_UPI_VPA
        value: campusgo.lpu@okhdfcbank
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: FAST2SMS_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
