services:
  - type: web
    name: campusgo-lpu
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt && python backend/seed_data.py
    startCommand: python backend/app.py
    envVars:
      - key: PORT
        value: 5000
      - key: CAMPUSGO_UPI_VPA
        value: campusgo.lpu@okhdfcbank
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: FAST2SMS_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
